<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Devops</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <h1>Tasks</h1>
    <table class="tasks-table">
        <tbody id="TasksDisplay">
            <tr>
                <td></td>
            </tr>
        </tbody>
    </table>

    <a href="addTask.html" class="btn-submit home-add-task">
        Add New Task
    </a>

    <!-- Delete Task - Harold's individual feature -->
    <dialog id="deleteTaskDialog" class="delete-task-dialog">

        <h2>Delete Task</h2>
        <p class="delete-confirmation">
            Are you sure you want to delete this task?
        </p>

        <!-- Display the selected task's details (read-only) -->
        <div class="delete-task-details">
            <p>Task Title</p>
            <div id="deleteTaskTitle"></div>
            <p>Subject</p>
            <div id="deleteTaskSubject"></div>
            <p>Status</p>
            <div id="deleteTaskStatus"></div>
            <p>Deadline</p>
            <div id="deleteTaskDeadline"></div>
            <p>Description</p>
            <div id="deleteTaskDescription"></div>
        </div>

        <!-- Confirmation buttons -->
        <div class="delete-task-actions">
            <button type="button" id="cancelDeleteButton">
                Cancel
            </button>

            <button type="button" id="confirmDeleteButton">
                Delete Task
            </button>
        </div>

    </dialog>

    <script src="./js/viewTasks.js"></script>

    <script src="./js/HaroldGoh.js"></script>
</body>

</html>
